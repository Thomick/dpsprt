[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dpsprt"
version = "1.2.0"
authors = [
    {name = "Thomas Michel", email = "thomas.michel.thmi@gmail.com"},
]
description = "Differentially Private Sequential Probability Ratio Tests"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = [
    "differential privacy",
    "sequential probability ratio test",
    "hypothesis testing",
    "privacy-preserving",
    "statistics",
    "machine learning"
]

dependencies = [
    "numpy>=1.20.0",
]

[project.optional-dependencies]
analysis = [
    "matplotlib>=3.5.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "isort>=5.10.0",
    "flake8>=5.0.0",
    "mypy>=1.0.0",
]
examples = [
    "matplotlib>=3.5.0",
    "jupyter>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/Thomick/dpsprt"
Repository = "https://github.com/Thomick/dpsprt"
Documentation = "https://github.com/Thomick/dpsprt#readme"
Paper = "https://proceedings.mlr.press/v300/michel26a.html"
"Bug Tracker" = "https://github.com/Thomick/dpsprt/issues"

[tool.setuptools.packages.find]
include = ["dpsprt*"]
exclude = ["dpsprt.tests*", "tests*", "docs*", "examples*"]

[tool.setuptools]
license-files = ["LICENSE"]
# MANIFEST.in puts the tests in the sdist so the suite is runnable from it;
# this keeps them out of the installed wheel.
include-package-data = false

[tool.black]
line-length = 100
target-version = ['py39']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3

[tool.mypy]
# No python_version pin. NumPy's stubs use PEP 695 type statements, which mypy
# only parses when the target version is 3.12 or later, so pinning the package's
# 3.9 floor here makes mypy fail on numpy rather than on this code.
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["dpsprt/tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["--strict-markers", "-v"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
source = ["dpsprt"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]